<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Albie Autofill — Configuración</title>
<style>
  body { font-family: system-ui, sans-serif; width: 420px; padding: 20px; color: #0D3A39; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.hint { font-size: 12px; color: #555; margin: 0 0 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  button { margin-top: 16px; background: #0D3A39; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:hover { background: #2F6B6D; }
  #status { margin-top: 10px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Albie Autofill — Configuración</h1>
  <p class="hint">
    Estos datos quedan guardados solo en este navegador (chrome.storage.local) y
    se usan para pegarle directo a la API de Airtable. Usá un Personal Access
    Token con permiso de <b>solo lectura</b> (data.records:read) restringido a
    la base de Onboarding-Albie.
  </p>

  <label for="pat">Airtable Personal Access Token</label>
  <input id="pat" type="password" placeholder="pat********************" autocomplete="off" />

  <label for="baseId">Airtable Base ID</label>
  <input id="baseId" type="text" placeholder="appXXXXXXXXXXXXXX" autocomplete="off" />

  <label for="table">Tabla</label>
  <input id="table" type="text" value="Onboardings_Hotel" />

  <button id="save">Guardar</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
